# Furniture for the placement faces the defaults do not cover: fixed transform pieces on a wall, a ceiling and a floor
it_wall:
  itemname: Integration Wall Piece
  material: PAPER
  Pack:
    model: nexo:item/nexo_furniture/arm_chair
  Mechanics:
    furniture:
      properties:
        display_transform: FIXED
      limited_placing:
        roof: false
        floor: false
        wall: true
      hitbox:
        barriers:
        - 0,0,0
