# Dev server config, copied into run/plugins/surf-polar-paper-runtime-paper by startDevelopmentStack
# when none exists. Switch storage-type and restart the paper container to try another storage.

# The game mode this server hosts worlds for.
game-mode-identifier: default
storage:
    # Where worlds are stored: DISK, DATABASE or S3. Only the matching section below is used.
    storage-type: S3
    disk:
        # The path to the directory where files will be stored relative to the plugin root.
        path: worlds
    # SeaweedFS from compose.yaml, the credentials match S3_ACCESS_KEY and S3_SECRET_KEY
    s3:
        endpoint: http://seaweedfs:8333
        region: us-east-1
        bucket: worlds
        access-key: surf
        secret-key: surf-secret
    # Goes through RabbitMQ to the microservice, configured via the SURF_RABBITMQ_* variables
    database: {}
