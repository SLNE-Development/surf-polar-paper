name: Publish to Maven & Create GitHub Release

on:
  push:
    branches:
      - version/**
  workflow_dispatch:

jobs:
  build:
    uses: SLNE-Development/surf-workflows/.github/workflows/build-publish-release-gradle.yml@master
    with:
      modules: "surf-polar-paper-runtime-paper-*-all.jar"
    secrets: inherit

  microservice-image:
    name: Build and push the microservice image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Read project version
        run: echo "VERSION=$(sed -n 's/^version=//p' gradle.properties)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: surf-polar-paper-runtime/surf-polar-paper-runtime-microservice/Dockerfile
          push: true
          tags: |
            ghcr.io/slne-development/surf-polar-paper-microservice:${{ env.VERSION }}
            ghcr.io/slne-development/surf-polar-paper-microservice:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
